name: Release

on:
  release:
    types: [ created ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binary:
    strategy:
      matrix:
        include:
        - name: Linux 64-bit
          file-name: linux_amd64
          target: x86_64-unknown-linux-gnu
          host: ubuntu-latest
          use-cross: true
        - name: Linux 32-bit
          file-name: linux_386
          target: i686-unknown-linux-gnu
          host: ubuntu-latest
          use-cross: true
        - name: Linux ARM 64-bit
          file-name: linux_aarch64
          target: aarch64-unknown-linux-gnu
          host: ubuntu-latest
          use-cross: true
        - name: macOS
          file-name: darwin_amd64
          target: x86_64-apple-darwin
          host: macos-15-intel
          use-cross: false
        - name: macOS Apple Silicon
          file-name: darwin_aarch64
          target: aarch64-apple-darwin
          host: macos-15
          use-cross: false

    runs-on: ${{ matrix.host }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
          targets: ${{ matrix.target }}
    - name: Use cache for Rust dependencies
      uses: Swatinem/rust-cache@v2
    - name: Install cross
      if: matrix.use-cross
      run: cargo install cross --git https://github.com/cross-rs/cross
    - name: Build with cross
      if: matrix.use-cross
      run: cross build --release --target ${{ matrix.target }}
    - name: Build with cargo
      if: ${{ !matrix.use-cross }}
      run: cargo build --release --target ${{ matrix.target }}
    - name: Rename binary
      run: mv target/${{ matrix.target }}/release/reshape ./reshape-${{ matrix.file-name }}
    - name: Upload binary to release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload ${GITHUB_REF##*/} "reshape-${{ matrix.file-name }}#${{ matrix.name }}" --clobber

  build-docker:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          docker login -u ${{ secrets.DOCKER_USER }} -p $DOCKER_PASSWORD
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ secrets.DOCKER_USER }}/reshape,push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-docker:
    runs-on: ubuntu-latest
    needs: build-docker
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: |
          docker login -u ${{ secrets.DOCKER_USER }} -p $DOCKER_PASSWORD
      - name: Create and push multi-arch image
        working-directory: ${{ runner.temp }}/digests
        # GITHUB_REF is formatted as: refs/tags/v0.0.1
        # The shell expansion used below will remove everything up to the version number, leaving 0.0.1
        run: |
          docker buildx imagetools create \
            --tag ${{ secrets.DOCKER_USER }}/reshape:${GITHUB_REF##*/v} \
            --tag ${{ secrets.DOCKER_USER }}/reshape:latest \
            $(printf '${{ secrets.DOCKER_USER }}/reshape@sha256:%s ' *)

  publish-crate:
    runs-on: ubuntu-latest
    needs: ["build-binary", "publish-docker"]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Select Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Publish to crates.io
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}